name: Emulator Unit Tests

on:
  pull_request:
  push:
    branches:
      - main
      - master
      - develop
      - "feat/**"

jobs:
  emulator-tests:
    name: Firestore Emulator Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java (required by Firebase Emulator)
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22.22.0"

      - name: Setup Python for CPU media tests
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: python_media_worker/requirements-ci.txt

      - name: Install dependencies
        run: |
          echo "Running npm ci; if it fails due to lockfile mismatch, fall back to npm install"
          npm ci || (echo "npm ci failed — falling back to npm install" && npm install)

      - name: Install frontend dependencies
        run: |
          echo "Installing frontend devDependencies"
          npm ci --prefix frontend || (echo "frontend npm ci failed — falling back to npm install" && npm install --prefix frontend)

      - name: Install and verify CPU preview runtime
        run: |
          sudo apt-get update
          sudo apt-get install --yes ffmpeg
          ffmpeg -version
          ffprobe -version
          python -m pip install --requirement python_media_worker/requirements-ci.txt
          PYTHONPATH=python_media_worker python -c "import numpy, PIL, studio_voice_bus_preview; print('CPU preview imports ready: NumPy', numpy.__version__, 'Pillow', PIL.__version__)"

      - name: Run emulator-backed unit tests
        timeout-minutes: 20
        env:
          CI: true
          STUDIO_AUDIO_PREVIEW_PYTHON: python
        run: npm run test:emulator

      - name: Note about lockfile
        if: ${{ failure() }}
        run: |
          echo "If workflow failed due to lockfile mismatch, update your local lockfile:"
          echo "  npm install --package-lock-only"
          echo "Then commit the updated package-lock.json and push."
