name: Deploy Viral Media Worker

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/deploy-media-worker.yml
      - python_media_worker/**

permissions:
  contents: read
  id-token: write

concurrency:
  group: media-worker-production
  cancel-in-progress: false

env:
  PROJECT_ID: autopromote-cc6d3
  REGION: us-central1
  SERVICE_NAME: media-worker-v1
  WIF_PROVIDER: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
  WIF_SERVICE_ACCOUNT: ${{ secrets.GCP_DEPLOY_SERVICE_ACCOUNT }}
  LEGACY_CREDENTIALS: ${{ secrets.FIREBASE_ADMIN_SERVICE_ACCOUNT }}
  TASK_SECRET_NAME: cam-combiner-task-secret

jobs:
  deploy:
    name: Build, verify and promote Cloud Run revision
    runs-on: ubuntu-latest
    timeout-minutes: 75

    steps:
      - name: Checkout requested revision
        uses: actions/checkout@v4

      - name: Install FFmpeg test dependency
        run: |
          sudo apt-get update
          sudo apt-get install --yes ffmpeg

      - name: Validate Google Cloud identity configuration
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "${WIF_PROVIDER}" && -n "${WIF_SERVICE_ACCOUNT}" ]]; then
            echo "Using keyless Google Workload Identity Federation."
            exit 0
          fi
          if [[ -n "${LEGACY_CREDENTIALS}" ]]; then
            echo "Workload Identity is not configured; using the existing repository service account for this deployment."
            exit 0
          fi
          echo "No Google Cloud deploy identity is configured."
          echo "Add GCP_WORKLOAD_IDENTITY_PROVIDER and GCP_DEPLOY_SERVICE_ACCOUNT as repository secrets."
          exit 1

      - name: Authenticate with Workload Identity
        if: ${{ env.WIF_PROVIDER != '' && env.WIF_SERVICE_ACCOUNT != '' }}
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.WIF_SERVICE_ACCOUNT }}

      - name: Authenticate with existing service account fallback
        if: ${{ env.WIF_PROVIDER == '' || env.WIF_SERVICE_ACCOUNT == '' }}
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ env.LEGACY_CREDENTIALS }}

      - name: Install Google Cloud CLI
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.PROJECT_ID }}

      - name: Verify deployment identity
        shell: bash
        run: |
          set -euo pipefail
          gcloud auth list --filter=status:ACTIVE --format='value(account)'
          gcloud config set project "${PROJECT_ID}"

      - name: Build and render-test immutable worker image
        working-directory: python_media_worker
        shell: bash
        run: |
          set -euo pipefail
          IMAGE="gcr.io/${PROJECT_ID}/${SERVICE_NAME}:${GITHUB_SHA}"
          gcloud auth configure-docker gcr.io --quiet
          docker build --tag "${IMAGE}" .

          docker run --rm \
            --volume "${GITHUB_WORKSPACE}:/workspace:ro" \
            --workdir /workspace \
            --entrypoint python \
            "${IMAGE}" \
            -m unittest \
            python_media_worker.test_viral_render_contract \
            python_media_worker.test_studio_finish \
            python_media_worker.test_caption_quality \
            python_media_worker.test_content_aware_reality \
            python_media_worker.test_motion_sculpture \
            python_media_worker.test_viral_creative_effects \
            python_media_worker.test_viral_studio_plan

          mkdir -p /tmp/viral-render-smoke
          ffmpeg -v error \
            -f lavfi -i "color=c=blue:s=360x640:d=2:r=24" \
            -f lavfi -i "sine=frequency=880:duration=2" \
            -c:v libx264 -pix_fmt yuv420p -c:a aac -shortest \
            -movflags +faststart -y /tmp/viral-render-smoke/source.mp4

          docker run --detach --rm \
            --name media-worker-render-smoke \
            --publish 18080:8080 \
            --volume /tmp/viral-render-smoke:/tmp/viral-render-smoke:ro \
            --env NODE_ENV=development \
            --env ENABLE_LOCAL_MEDIA_OUTPUT_FALLBACK=true \
            --env FIREBASE_STORAGE_BUCKET=autopromote-cc6d3.firebasestorage.app \
            "${IMAGE}"
          trap 'docker logs media-worker-render-smoke || true; docker stop media-worker-render-smoke || true' EXIT

          for attempt in $(seq 1 60); do
            if curl --fail --silent --show-error --max-time 5 \
              "http://127.0.0.1:18080/status" > /tmp/viral-render-smoke/status.json; then
              break
            fi
            if [[ "${attempt}" = "60" ]]; then
              echo "Local media-worker container never became healthy."
              exit 1
            fi
            sleep 2
          done

          curl --fail --silent --show-error --max-time 300 \
            --header "Content-Type: application/json" \
            --data '{
              "video_url": "/tmp/viral-render-smoke/source.mp4",
              "start_time": 0,
              "end_time": 2,
              "auto_captions": false,
              "smart_crop": true,
              "smart_crop_mode": "ai_director",
              "export_destination": "tiktok",
              "professional_cleanup": true,
              "finish_plan": {
                "enabled": true,
                "color": {"contrast": 1.08, "saturation": 1.05},
                "texture": {"film_grain": 0.02, "chromatic_aberration": 0.02},
                "visualizer": {"enabled": true, "mode": "wave", "position": "top"}
              },
              "sound_effects": [{
                "id": "smoke-impact",
                "name": "Impact",
                "builtIn": true,
                "tone": "impact",
                "startTime": 0.5,
                "duration": 0.4,
                "volume": 0.2,
                "enabled": true
              }],
              "brand_watermark": false,
              "overlays": [],
              "async_mode": false
            }' \
            "http://127.0.0.1:18080/render-viral-clip" \
            > /tmp/viral-render-smoke/result.json

          OUTPUT_PATH=$(python - <<'PY'
          import json
          from pathlib import Path

          result = json.loads(Path("/tmp/viral-render-smoke/result.json").read_text())
          if result.get("status") != "completed":
              raise SystemExit(f"Real Viral Clip render did not complete: {result}")
          if int(result.get("progress") or 0) != 100:
              raise SystemExit(f"Real Viral Clip render did not reach 100%: {result}")
          quality_gate = result.get("final_quality_gate") or {}
          if quality_gate.get("status") != "passed":
              raise SystemExit(f"Real Viral Clip quality gate failed: {quality_gate}")
          media = result.get("media_validation") or {}
          video = media.get("video") or {}
          audio = media.get("audio") or {}
          if (video.get("width"), video.get("height")) != (1080, 1920):
              raise SystemExit(f"Vertical delivery dimensions are wrong: {video}")
          if video.get("codec_name") != "h264" or audio.get("codec_name") != "aac":
              raise SystemExit(f"Browser delivery codecs are wrong: {media}")
          output_path = str(result.get("output_path") or "")
          if not output_path:
              raise SystemExit(f"Real Viral Clip render returned no output path: {result}")
          print(output_path)
          PY
          )
          docker exec media-worker-render-smoke test -s "${OUTPUT_PATH}"
          docker stop media-worker-render-smoke
          trap - EXIT

          docker push "${IMAGE}"
          echo "IMAGE=${IMAGE}" >> "${GITHUB_ENV}"

      - name: Deploy candidate with zero production traffic
        id: candidate
        shell: bash
        run: |
          set -euo pipefail
          PREVIOUS_REVISION=$(gcloud run services describe "${SERVICE_NAME}" \
            --region "${REGION}" --format='value(status.latestReadyRevisionName)' 2>/dev/null || true)
          gcloud run deploy "${SERVICE_NAME}" \
            --image "${IMAGE}" \
            --platform managed \
            --execution-environment gen2 \
            --region "${REGION}" \
            --allow-unauthenticated \
            --memory 4Gi \
            --cpu 4 \
            --cpu-boost \
            --timeout 900 \
            --concurrency 1 \
            --min-instances 0 \
            --max-instances 3 \
            --no-traffic \
            --tag "${TAG}" \
            --set-secrets "MEDIA_WORKER_TASK_SECRET=${TASK_SECRET_NAME}:latest" \
            --set-env-vars "NODE_ENV=production,FIREBASE_STORAGE_BUCKET=autopromote-cc6d3.firebasestorage.app,MULTICAM_UPLOAD_FIREBASE=true,MULTICAM_MASTER_RETENTION_DAYS=7,ENABLE_LOCAL_MEDIA_OUTPUT_FALLBACK=false,WHISPER_ENGINE=faster,PROMO_WHISPER_MODEL=small,FASTER_WHISPER_DEVICE=cpu,FASTER_WHISPER_COMPUTE_TYPE=int8,FASTER_WHISPER_STRICT=true,ALLOW_RUNTIME_DEPENDENCY_INSTALL=false"

          gcloud run services describe "${SERVICE_NAME}" \
            --region "${REGION}" \
            --format=json > /tmp/media-worker-service.json
          REVISION=$(python -c 'import json; print(json.load(open("/tmp/media-worker-service.json"))["status"]["latestCreatedRevisionName"])')
          CANDIDATE_URL=$(python -c 'import json,os; data=json.load(open("/tmp/media-worker-service.json")); tag=os.environ["TAG"]; print(next(item["url"] for item in data["status"].get("traffic",[]) if item.get("tag")==tag))')
          echo "revision=${REVISION}" >> "${GITHUB_OUTPUT}"
          echo "candidate_url=${CANDIDATE_URL}" >> "${GITHUB_OUTPUT}"
          echo "previous_revision=${PREVIOUS_REVISION}" >> "${GITHUB_OUTPUT}"
        env:
          TAG: candidate-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Verify candidate health and real render
        shell: bash
        env:
          CANDIDATE_URL: ${{ steps.candidate.outputs.candidate_url }}
        run: |
          set -euo pipefail
          CANDIDATE_HEALTHY=false
          for attempt in $(seq 1 18); do
            if curl --fail --silent --show-error --max-time 30 "${CANDIDATE_URL}/status" > /tmp/media-worker-status.json; then
              python -m json.tool /tmp/media-worker-status.json
              CANDIDATE_HEALTHY=true
              break
            fi
            echo "Candidate is still starting (${attempt}/18)."
            sleep 10
          done
          if [[ "${CANDIDATE_HEALTHY}" != "true" ]]; then
            echo "Candidate health verification failed; production traffic was not changed."
            exit 1
          fi
          curl --fail --silent --show-error --max-time 600 \
            --header "Content-Type: application/json" \
            --data '{
              "video_url": "https://storage.googleapis.com/gtv-videos-bucket/sample/ForBiggerBlazes.mp4",
              "start_time": 0,
              "end_time": 2,
              "overlays": [],
              "auto_captions": false,
              "smart_crop": false,
              "professional_cleanup": true,
              "finish_plan": {
                "enabled": true,
                "color": {"contrast": 1.05, "saturation": 1.04},
                "visualizer": {"enabled": true, "mode": "wave", "position": "top"}
              },
              "sound_effects": [{
                "id": "candidate-impact",
                "builtIn": true,
                "tone": "impact",
                "startTime": 0.5,
                "duration": 0.35,
                "volume": 0.15,
                "enabled": true
              }],
              "brand_watermark": false,
              "async_mode": false
            }' \
            "${CANDIDATE_URL}/render-viral-clip" > /tmp/media-worker-candidate-render.json
          python - <<'PY'
          import json
          from pathlib import Path

          result = json.loads(Path("/tmp/media-worker-candidate-render.json").read_text())
          if result.get("status") != "completed":
              raise SystemExit(f"Candidate render did not complete: {result}")
          if (result.get("final_quality_gate") or {}).get("status") != "passed":
              raise SystemExit(f"Candidate render quality gate failed: {result}")
          if not (result.get("audio_proof") or {}).get("verified"):
              raise SystemExit(f"Candidate render audio proof failed: {result}")
          print("Candidate completed a real video, visualizer and SFX render.")
          PY

      - name: Promote verified revision to production
        shell: bash
        env:
          REVISION: ${{ steps.candidate.outputs.revision }}
        run: |
          set -euo pipefail
          gcloud run services update-traffic "${SERVICE_NAME}" \
            --region "${REGION}" \
            --to-revisions "${REVISION}=100"

      - name: Verify production service
        shell: bash
        env:
          REVISION: ${{ steps.candidate.outputs.revision }}
        run: |
          set -euo pipefail
          SERVICE_URL=$(gcloud run services describe "${SERVICE_NAME}" --region "${REGION}" --format='value(status.url)')
          LIVE_REVISION=$(gcloud run services describe "${SERVICE_NAME}" --region "${REGION}" --format='value(status.latestReadyRevisionName)')
          test "${LIVE_REVISION}" = "${REVISION}"
          curl --fail --silent --show-error --max-time 30 "${SERVICE_URL}/status" | python -m json.tool
          echo "Cloud Run revision ${REVISION} is healthy at ${SERVICE_URL}."

      - name: Roll back production traffic after a failed promotion check
        if: ${{ failure() && steps.candidate.outputs.previous_revision != '' }}
        shell: bash
        env:
          PREVIOUS_REVISION: ${{ steps.candidate.outputs.previous_revision }}
        run: |
          set -euo pipefail
          gcloud run services update-traffic "${SERVICE_NAME}" \
            --region "${REGION}" \
            --to-revisions "${PREVIOUS_REVISION}=100"
          echo "Rolled production traffic back to ${PREVIOUS_REVISION}."
