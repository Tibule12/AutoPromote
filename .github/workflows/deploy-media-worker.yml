name: Deploy Viral Media Worker

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      # Workflow-only edits remain deployable through workflow_dispatch.
      - python_media_worker/**
      # The renewable launcher is injected into pinned Jobs and does not alter
      # the serving native image. Avoid an unnecessary CPU/GPU image rebuild.
      - '!python_media_worker/renewable_native_job_runner.py'
      - scripts/verify-gpu-media-worker.py

permissions:
  contents: read
  id-token: write

concurrency:
  group: media-worker-production
  cancel-in-progress: false

env:
  PROJECT_ID: autopromote-cc6d3
  REGION: us-central1
  SERVICE_NAME: media-worker-v1
  WIF_PROVIDER: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
  WIF_SERVICE_ACCOUNT: ${{ secrets.GCP_DEPLOY_SERVICE_ACCOUNT }}
  LEGACY_CREDENTIALS: ${{ secrets.FIREBASE_ADMIN_SERVICE_ACCOUNT }}
  TASK_SECRET_NAME: cam-combiner-task-secret

jobs:
  deploy:
    name: Build, verify and promote Cloud Run revision
    runs-on: ubuntu-latest
    timeout-minutes: 75
    outputs:
      image: ${{ steps.build.outputs.image }}

    steps:
      - name: Checkout requested revision
        uses: actions/checkout@v4

      - name: Install FFmpeg test dependency
        run: |
          sudo apt-get update
          sudo apt-get install --yes ffmpeg

      - name: Validate Google Cloud identity configuration
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "${WIF_PROVIDER}" && -n "${WIF_SERVICE_ACCOUNT}" ]]; then
            echo "Using keyless Google Workload Identity Federation."
            exit 0
          fi
          if [[ -n "${LEGACY_CREDENTIALS}" ]]; then
            echo "Workload Identity is not configured; using the existing repository service account for this deployment."
            exit 0
          fi
          echo "No Google Cloud deploy identity is configured."
          echo "Add GCP_WORKLOAD_IDENTITY_PROVIDER and GCP_DEPLOY_SERVICE_ACCOUNT as repository secrets."
          exit 1

      - name: Authenticate with Workload Identity
        if: ${{ env.WIF_PROVIDER != '' && env.WIF_SERVICE_ACCOUNT != '' }}
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.WIF_SERVICE_ACCOUNT }}

      - name: Authenticate with existing service account fallback
        if: ${{ env.WIF_PROVIDER == '' || env.WIF_SERVICE_ACCOUNT == '' }}
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ env.LEGACY_CREDENTIALS }}

      - name: Install Google Cloud CLI
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.PROJECT_ID }}

      - name: Verify deployment identity
        shell: bash
        run: |
          set -euo pipefail
          gcloud auth list --filter=status:ACTIVE --format='value(account)'
          gcloud config set project "${PROJECT_ID}"

      - name: Build and render-test immutable worker image
        id: build
        shell: bash
        run: |
          set -euo pipefail
          export IMAGE="gcr.io/${PROJECT_ID}/${SERVICE_NAME}:${GITHUB_SHA}"
          gcloud auth configure-docker gcr.io --quiet
          bash scripts/verify-media-worker-image.sh
          docker push "${IMAGE}"
          echo "IMAGE=${IMAGE}" >> "${GITHUB_ENV}"
          echo "image=${IMAGE}" >> "${GITHUB_OUTPUT}"

      - name: Deploy candidate with zero production traffic
        id: candidate
        shell: bash
        run: |
          set -euo pipefail
          PREVIOUS_REVISION=$(gcloud run services describe "${SERVICE_NAME}" \
            --region "${REGION}" --format='value(status.latestReadyRevisionName)' 2>/dev/null || true)
          gcloud run deploy "${SERVICE_NAME}" \
            --image "${IMAGE}" \
            --platform managed \
            --execution-environment gen2 \
            --region "${REGION}" \
            --allow-unauthenticated \
            --memory 8Gi \
            --cpu 4 \
            --cpu-boost \
            --timeout 3600 \
            --concurrency 1 \
            --min-instances 0 \
            --max-instances 3 \
            --no-traffic \
            --tag "${TAG}" \
            --set-secrets "MEDIA_WORKER_TASK_SECRET=${TASK_SECRET_NAME}:latest" \
            --set-env-vars "NODE_ENV=production,FIREBASE_STORAGE_BUCKET=autopromote-cc6d3.firebasestorage.app,MULTICAM_UPLOAD_FIREBASE=true,MULTICAM_MASTER_RETENTION_DAYS=7,ENABLE_LOCAL_MEDIA_OUTPUT_FALLBACK=false,WHISPER_ENGINE=faster,PROMO_WHISPER_MODEL=small,VIRAL_CAPTION_GENERAL_WHISPER_MODEL=deepdml/faster-whisper-large-v3-turbo-ct2,FASTER_WHISPER_DEVICE=cpu,FASTER_WHISPER_COMPUTE_TYPE=int8,FASTER_WHISPER_STRICT=true,VIDEO_ENCODER=libx264,ALLOW_RUNTIME_DEPENDENCY_INSTALL=false"

          gcloud run services describe "${SERVICE_NAME}" \
            --region "${REGION}" \
            --format=json > /tmp/media-worker-service.json
          REVISION=$(python -c 'import json; print(json.load(open("/tmp/media-worker-service.json"))["status"]["latestCreatedRevisionName"])')
          CANDIDATE_URL=$(python -c 'import json,os; data=json.load(open("/tmp/media-worker-service.json")); tag=os.environ["TAG"]; print(next(item["url"] for item in data["status"].get("traffic",[]) if item.get("tag")==tag))')
          echo "revision=${REVISION}" >> "${GITHUB_OUTPUT}"
          echo "candidate_url=${CANDIDATE_URL}" >> "${GITHUB_OUTPUT}"
          echo "previous_revision=${PREVIOUS_REVISION}" >> "${GITHUB_OUTPUT}"
        env:
          TAG: candidate-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Verify candidate health and real render
        shell: bash
        env:
          CANDIDATE_URL: ${{ steps.candidate.outputs.candidate_url }}
        run: |
          set -euo pipefail
          CANDIDATE_HEALTHY=false
          for attempt in $(seq 1 18); do
            if curl --fail --silent --show-error --max-time 30 "${CANDIDATE_URL}/status" > /tmp/media-worker-status.json; then
              python -m json.tool /tmp/media-worker-status.json
              CANDIDATE_HEALTHY=true
              break
            fi
            echo "Candidate is still starting (${attempt}/18)."
            sleep 10
          done
          if [[ "${CANDIDATE_HEALTHY}" != "true" ]]; then
            echo "Candidate health verification failed; production traffic was not changed."
            exit 1
          fi
          if ! curl --fail-with-body --silent --show-error --max-time 600 \
            --header "Content-Type: application/json" \
            --data '{
              "video_url": "https://raw.githubusercontent.com/mediaelement/mediaelement-files/4d21a042353022326071acb0251ab75cd6bae114/big_buck_bunny.mp4",
              "start_time": 0,
              "end_time": 2,
              "overlays": [],
              "auto_captions": false,
              "smart_crop": false,
              "professional_cleanup": true,
              "finish_plan": {
                "enabled": true,
                "color": {"contrast": 1.05, "saturation": 1.04},
                "visualizer": {"enabled": true, "mode": "wave", "position": "top"}
              },
              "sound_effects": [{
                "id": "candidate-impact",
                "builtIn": true,
                "tone": "impact",
                "startTime": 0.5,
                "duration": 0.35,
                "volume": 0.15,
                "enabled": true
              }],
              "brand_watermark": false,
              "async_mode": false
            }' \
            "${CANDIDATE_URL}/render-viral-clip" > /tmp/media-worker-candidate-render.json; then
            python -m json.tool /tmp/media-worker-candidate-render.json || true
            exit 1
          fi
          python - <<'PY'
          import json
          from pathlib import Path

          result = json.loads(Path("/tmp/media-worker-candidate-render.json").read_text())
          if result.get("status") != "completed":
              raise SystemExit(f"Candidate render did not complete: {result}")
          if (result.get("final_quality_gate") or {}).get("status") != "passed":
              raise SystemExit(f"Candidate render quality gate failed: {result}")
          if not (result.get("audio_proof") or {}).get("verified"):
              raise SystemExit(f"Candidate render audio proof failed: {result}")
          print("Candidate completed a real video, visualizer and SFX render.")
          PY

      - name: Promote verified revision to production
        shell: bash
        env:
          REVISION: ${{ steps.candidate.outputs.revision }}
        run: |
          set -euo pipefail
          gcloud run services update-traffic "${SERVICE_NAME}" \
            --region "${REGION}" \
            --to-revisions "${REVISION}=100"

      - name: Verify production service
        shell: bash
        env:
          REVISION: ${{ steps.candidate.outputs.revision }}
        run: |
          set -euo pipefail
          SERVICE_URL=$(gcloud run services describe "${SERVICE_NAME}" --region "${REGION}" --format='value(status.url)')
          LIVE_REVISION=$(gcloud run services describe "${SERVICE_NAME}" --region "${REGION}" --format='value(status.latestReadyRevisionName)')
          test "${LIVE_REVISION}" = "${REVISION}"
          curl --fail --silent --show-error --max-time 30 "${SERVICE_URL}/status" | python -m json.tool
          echo "Cloud Run revision ${REVISION} is healthy at ${SERVICE_URL}."

      - name: Roll back production traffic after a failed promotion check
        if: ${{ failure() && steps.candidate.outputs.previous_revision != '' }}
        shell: bash
        env:
          PREVIOUS_REVISION: ${{ steps.candidate.outputs.previous_revision }}
        run: |
          set -euo pipefail
          gcloud run services update-traffic "${SERVICE_NAME}" \
            --region "${REGION}" \
            --to-revisions "${PREVIOUS_REVISION}=100"
          echo "Rolled production traffic back to ${PREVIOUS_REVISION}."

  deploy-gpu-backup:
    name: Verify and retain the private GPU backup
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      GPU_SERVICE: media-worker-gpu
    steps:
      - uses: actions/checkout@v4
      - name: Authenticate with Workload Identity
        if: ${{ env.WIF_PROVIDER != '' && env.WIF_SERVICE_ACCOUNT != '' }}
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.WIF_SERVICE_ACCOUNT }}
      - name: Authenticate with the existing service account
        if: ${{ env.WIF_PROVIDER == '' || env.WIF_SERVICE_ACCOUNT == '' }}
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ env.LEGACY_CREDENTIALS }}
      - uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.PROJECT_ID }}
      - name: Build GPU image from the exact verified CPU image
        env:
          CPU_IMAGE: ${{ needs.deploy.outputs.image }}
        run: |
          set -euo pipefail
          test -n "${CPU_IMAGE}"
          GPU_IMAGE="gcr.io/${PROJECT_ID}/${GPU_SERVICE}:${GITHUB_SHA}"
          gcloud auth configure-docker gcr.io --quiet
          docker build --file python_media_worker/Dockerfile.gpu-backup \
            --build-arg "MEDIA_WORKER_BASE_IMAGE=${CPU_IMAGE}" \
            --tag "${GPU_IMAGE}" python_media_worker
          docker push "${GPU_IMAGE}"
          echo "GPU_IMAGE=${GPU_IMAGE}" >> "${GITHUB_ENV}"
      - name: Deploy a private GPU candidate without moving traffic
        id: gpu-candidate
        env:
          TAG: candidate-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail
          PREVIOUS=$(gcloud run services describe "${GPU_SERVICE}" --region "${REGION}" \
            --format='value(status.latestReadyRevisionName)' 2>/dev/null || true)
          echo "previous_revision=${PREVIOUS}" >> "${GITHUB_OUTPUT}"
          gcloud run deploy "${GPU_SERVICE}" --image "${GPU_IMAGE}" \
            --region "${REGION}" --platform managed --execution-environment gen2 \
            --no-allow-unauthenticated --gpu 1 --gpu-type nvidia-rtx-pro-6000 \
            --no-gpu-zonal-redundancy --cpu 20 --memory 80Gi --no-cpu-throttling \
            --concurrency 1 --min-instances 0 --max-instances 1 --timeout 3600 \
            --no-traffic --tag "${TAG}" \
            --set-secrets "MEDIA_WORKER_TASK_SECRET=${TASK_SECRET_NAME}:latest" \
            --set-env-vars "NODE_ENV=production,FIREBASE_STORAGE_BUCKET=autopromote-cc6d3.firebasestorage.app,MULTICAM_UPLOAD_FIREBASE=true,ENABLE_LOCAL_MEDIA_OUTPUT_FALLBACK=false" --quiet
          gcloud run services add-iam-policy-binding "${GPU_SERVICE}" --region "${REGION}" \
            --member "serviceAccount:firebase-adminsdk-fbsvc@${PROJECT_ID}.iam.gserviceaccount.com" \
            --role roles/run.invoker --quiet
          gcloud run services describe "${GPU_SERVICE}" --region "${REGION}" --format=json > /tmp/gpu-service.json
          python - <<'PY'
          import json, os
          data = json.load(open('/tmp/gpu-service.json'))
          candidate = next(t['url'] for t in data['status']['traffic'] if t.get('tag') == os.environ['TAG'])
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write('candidate_url=' + candidate + '\n')
              f.write('revision=' + data['status']['latestCreatedRevisionName'] + '\n')
              f.write('audience=' + data['status']['url'] + '\n')
          PY
      - name: Prove CUDA startup and a real NVENC render with sound
        env:
          CANDIDATE_URL: ${{ steps.gpu-candidate.outputs.candidate_url }}
          WORKER_AUDIENCE: ${{ steps.gpu-candidate.outputs.audience }}
        run: |
          set -euo pipefail
          WORKER_TOKEN=$(gcloud auth print-identity-token --audiences="${WORKER_AUDIENCE}")
          echo "::add-mask::${WORKER_TOKEN}"
          export WORKER_TOKEN
          python scripts/verify-gpu-media-worker.py
      - name: Promote the verified GPU backup
        id: gpu-promote
        env:
          REVISION: ${{ steps.gpu-candidate.outputs.revision }}
        run: |
          set -euo pipefail
          gcloud run services update-traffic "${GPU_SERVICE}" --region "${REGION}" \
            --to-revisions "${REVISION}=100"
      - name: Restore the prior GPU revision if promotion fails
        if: ${{ failure() && steps.gpu-promote.outcome == 'failure' && steps.gpu-candidate.outputs.previous_revision != '' }}
        env:
          PREVIOUS: ${{ steps.gpu-candidate.outputs.previous_revision }}
        run: gcloud run services update-traffic "${GPU_SERVICE}" --region "${REGION}" --to-revisions "${PREVIOUS}=100"
