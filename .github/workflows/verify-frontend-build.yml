name: Verify Frontend Build

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch: {}

jobs:
  build-frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.22.0

      - name: Install root dependencies
        run: npm ci

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Check Studio Director server replay bundle
        run: npm run check:studio-director-replay

      - name: Verify education concepts and presentation release gates
        run: node --test test/education/byte-lab.test.mjs test/education/bubble-sort.test.mjs test/education/release-build-gate.test.cjs

      - name: Verify education presentations, private technical gates and Studio previews
        working-directory: frontend
        env:
          CI: "true"
        run: npm test -- --watch=false --runInBand --runTestsByPath src/education/__tests__/catLearningPath.test.js src/education/__tests__/catPresentation.test.js src/education/__tests__/technicalLearningPath.test.js src/education/__tests__/technicalPublicGate.test.js src/utils/__tests__/viralRenderRecovery.test.js src/components/__tests__/studioLogoDesign.test.js

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Verify build artifact exists
        working-directory: frontend
        run: |
          if [ -f build/index.html ]; then
            echo "Verified frontend artifact at build/index.html"
          elif [ -f docs/index.html ]; then
            echo "Verified frontend artifact at docs/index.html"
          else
            echo "ERROR: Neither build/index.html nor docs/index.html was found in frontend. Ensure build step ran successfully and BUILD_PATH is configured as expected.";
            ls -la . || true;
            ls -la build || true;
            ls -la docs || true;
            exit 1;
          fi

      - name: Run verify script (optional)
        run: npm run verify:frontend-build || true
