name: Playwright E2E

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 5 * * *" # daily smoke tests at 05:00 UTC

concurrency:
  group: playwright-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  playwright-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      FUNCTIONS_TOKEN_ENCRYPTION_KEY: ${{ secrets.FUNCTIONS_TOKEN_ENCRYPTION_KEY }}
      GENERIC_TOKEN_ENCRYPTION_KEY: ${{ secrets.GENERIC_TOKEN_ENCRYPTION_KEY }}
      TWITTER_TOKEN_ENCRYPTION_KEY: ${{ secrets.TWITTER_TOKEN_ENCRYPTION_KEY }}
      ENABLE_TEST_USAGE_NO_DB: "1"
      FIREBASE_ADMIN_BYPASS: "1"
      BYPASS_ACCEPTED_TERMS: "1"
      CI_ROUTE_IMPORTS: "1"
      CORS_ALLOW_ALL: "true"
      OPENAI_LOGGING_ENABLED: "1"
    strategy:
      matrix:
        node-version: [22.22.0]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"
      - name: Install deps
        timeout-minutes: 5
        run: npm ci
      - name: Install live-media test prerequisites
        timeout-minutes: 5
        run: |
          if ! command -v ffmpeg >/dev/null || ! command -v ffprobe >/dev/null; then
            sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=30 update
            sudo env DEBIAN_FRONTEND=noninteractive apt-get -o DPkg::Lock::Timeout=60 -o Acquire::Retries=2 -o Acquire::http::Timeout=30 install --yes --no-install-recommends ffmpeg
          fi
          ffmpeg -version
          ffprobe -version
      - name: Install frontend dependencies
        timeout-minutes: 5
        run: npm ci --prefix frontend
      - name: Build frontend
        timeout-minutes: 5
        env:
          # Synthetic browser identities require both the page and API to be
          # loopback. This fixture build must not target production services.
          REACT_APP_API_URL: http://127.0.0.1:5000
        run: npm run build --prefix frontend
      - name: Prepare playwright browsers
        timeout-minutes: 5
        run: npx playwright install --with-deps chromium
      - name: Upload test reporters directory (pre-clean)
        run: rm -rf test-results || true
      - name: Setup isolated Firebase emulator runtime
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Run Playwright E2E against demo emulator only
        timeout-minutes: 20
        env:
          NODE_ENV: test
          GCLOUD_PROJECT: demo-autopromote-e2e
          FIREBASE_PROJECT_ID: demo-autopromote-e2e
          GOOGLE_CLOUD_PROJECT: demo-autopromote-e2e
          FIREBASE_ADMIN_SERVICE_ACCOUNT: ""
          FIREBASE_ADMIN_SERVICE_ACCOUNT_BASE64: ""
          GOOGLE_APPLICATION_CREDENTIALS: ""
        run: |
          npx firebase emulators:exec --only firestore --project demo-autopromote-e2e "node ./scripts/seed-autopilot-emulator.js && npx playwright test test/e2e/playwright --config=test/e2e/playwright/playwright.config.js --workers=1"
      - name: Upload Playwright artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-report
          path: |
            test-results/**
            playwright-report/**
            test/e2e/**/playwright-report/**
      - name: Run smoke tests (daily)
        if: github.event_name == 'schedule'
        run: |
          node ./tools/smoke-tests/runSmokeTests.js
          echo "Running Jest canary smoke tests (TikTok gating)"
          npx jest src/services/__tests__/promotion_canary.test.js --runInBand --silent
