steps:
  - name: gcr.io/cloud-builders/docker
    entrypoint: bash
    args:
      - -c
      - docker pull "${_CACHE_IMAGE}" || true
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - --cache-from
      - ${_CACHE_IMAGE}
      - --file
      - Dockerfile
      - --tag
      - ${_IMAGE}
      - .
images:
  - ${_IMAGE}
substitutions:
  _IMAGE: gcr.io/$PROJECT_ID/media-worker-v1:latest
  _CACHE_IMAGE: gcr.io/$PROJECT_ID/media-worker-v1:latest
timeout: 3600s
